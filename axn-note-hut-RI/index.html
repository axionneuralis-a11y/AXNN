<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c62828" />
    <title>AXN Note — HUT RI ke-81</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="assets/icons/icon-1.svg" type="image/svg+xml" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <style>
        /* ===== RESET & VARIABEL ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --red: #c62828;
            --red-light: #e53935;
            --red-dark: #8e0000;
            --gold: #d4a017;
            --gold-light: #f5d742;
            --gold-glow: rgba(212, 160, 23, 0.25);
            --white: #fefcf7;
            --cream: #fdf6ed;
            --charcoal: #1e1e2a;
            --bg-primary: #faf5ee;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-nav: #c62828;
            --text-primary: #1e1e2a;
            --text-secondary: #5a5a72;
            --text-nav: #ffffff;
            --border-color: #e8ddd0;
            --shadow: 0 8px 28px rgba(198, 40, 40, 0.10);
            --shadow-lg: 0 12px 40px rgba(198, 40, 40, 0.16);
            --radius: 18px;
            --radius-sm: 10px;
            --accent: #c62828;
            --accent-hover: #b71c1c;
            --danger: #c62828;
            --success: #2e7d32;
            --warning: #b76e00;
            --transition: 0.30s cubic-bezier(0.22, 1, 0.36, 1);
            --font: 'Inter', system-ui, -apple-system, sans-serif;
            --folder-color: #c47b1f;
            --file-color: #1a5fb4;
            --nav-height: 60px;
            color-scheme: light;
        }

        :root[data-theme="dark"] {
            --bg-primary: #12121e;
            --bg-secondary: #1c1c2e;
            --bg-card: #26263e;
            --bg-nav: #8e0000;
            --text-primary: #eeeef8;
            --text-secondary: #9898b8;
            --text-nav: #eeeef8;
            --border-color: #3a3a56;
            --shadow: 0 8px 28px rgba(0, 0, 0, 0.50);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.60);
            --gold: #e6b422;
            --gold-glow: rgba(230, 180, 34, 0.20);
            --cream: #1e1e2e;
            --white: #1c1c2e;
            color-scheme: dark;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 14px;
            line-height: 1.6;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            margin: 0;
            padding: 0;
        }

        .visually-hidden {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            margin: -1px !important;
            padding: 0 !important;
            overflow: hidden !important;
            clip: rect(0 0 0 0) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: none;
            cursor: pointer;
        }

        input,
        textarea {
            font: inherit;
            color: inherit;
        }

        /* ===== APP SHELL ===== */
        .app {
            width: 100%;
            max-width: 540px;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
            box-shadow: var(--shadow-lg);
        }

        @media (min-width: 640px) {
            .app {
                border-radius: 28px;
                margin: 16px;
                min-height: calc(100vh - 32px);
                min-height: calc(100dvh - 32px);
                max-height: calc(100vh - 32px);
                max-height: calc(100dvh - 32px);
                overflow: hidden;
            }
        }

        /* ===== MERDEKA BADGE ===== */
        .merdeka-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.13);
            padding: 4px 12px 4px 8px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.3px;
            color: #fff;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            white-space: nowrap;
        }
        .merdeka-badge .flag {
            font-size: 16px;
            line-height: 1;
        }
        .merdeka-badge .year {
            color: var(--gold-light);
            font-weight: 800;
        }

        /* ===== HEADER ===== */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 12px;
            min-height: var(--nav-height);
            background: var(--bg-nav);
            color: var(--text-nav);
            box-shadow: 0 4px 20px rgba(198, 40, 40, 0.25);
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            flex: 0 0 36px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.13);
        }

        .brand-logo svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
            color: var(--text-nav);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .brand h1 span {
            color: var(--gold-light);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        .icon-button {
            min-width: 40px;
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            background: transparent;
            color: inherit;
            padding: 6px;
            transition: background var(--transition);
        }
        .icon-button:hover {
            background: rgba(255, 255, 255, 0.14);
        }
        .icon-button svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: block;
        }

        .icon-moon {
            display: none;
        }
        :root[data-theme="dark"] .icon-sun {
            display: none;
        }
        :root[data-theme="dark"] .icon-moon {
            display: block;
        }

        /* ===== MAIN VIEW ===== */
        .main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        /* ===== SEARCH ===== */
        .search-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .search-row input {
            flex: 1;
            min-height: 42px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0 12px;
            background: var(--bg-card);
            color: var(--text-primary);
            font: inherit;
            transition: border var(--transition), box-shadow var(--transition);
        }
        .search-row input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(198, 40, 40, 0.12);
        }

        .search-clear {
            color: var(--text-secondary);
        }

        /* ===== BREADCRUMB ===== */
        .breadcrumb {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2px;
            padding: 8px 14px;
            color: var(--text-secondary);
            font-size: 13px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 44px;
        }

        .breadcrumb button {
            min-height: 32px;
            padding: 4px 8px;
            border-radius: 6px;
            background: transparent;
            color: var(--accent);
            font-weight: 600;
            font-size: 13px;
            transition: background var(--transition);
        }
        .breadcrumb button:hover {
            background: rgba(198, 40, 40, 0.06);
        }

        .breadcrumb-sep {
            opacity: 0.6;
            padding: 0 2px;
            font-weight: 300;
        }

        .breadcrumb-current {
            color: var(--text-primary);
            font-weight: 700;
            padding: 4px 4px;
            overflow-wrap: anywhere;
            font-size: 13px;
        }

        /* ===== ITEM LIST ===== */
        .item-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px 100px;
            display: grid;
            gap: 10px;
            align-content: start;
            scroll-behavior: smooth;
        }

        .item {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            min-height: 64px;
            padding: 10px 10px 10px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
            position: relative;
        }
        .item:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(198, 40, 40, 0.15);
        }
        .item:active {
            transform: scale(0.99);
        }

        .item-icon {
            width: 40px;
            height: 40px;
            flex: 0 0 40px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            transition: background var(--transition);
        }

        .item-icon svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .item.folder .item-icon {
            color: var(--folder-color);
            background: rgba(196, 123, 31, 0.12);
        }

        .item.file .item-icon {
            color: var(--file-color);
            background: rgba(26, 95, 180, 0.12);
        }

        .item-text {
            min-width: 0;
        }

        .item-name {
            font-weight: 700;
            font-size: 15px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: -0.2px;
        }

        .item-meta {
            margin-top: 2px;
            color: var(--text-secondary);
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item-menu {
            min-width: 40px;
            min-height: 40px;
            border-radius: 10px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 20px;
            line-height: 1;
            transition: background var(--transition), color var(--transition);
        }
        .item-menu:hover {
            background: rgba(0, 0, 0, 0.04);
            color: var(--text-primary);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            padding: 32px 18px;
            text-align: center;
            color: var(--text-secondary);
            background: var(--bg-card);
            border: 1.5px dashed var(--border-color);
            border-radius: var(--radius);
            font-weight: 500;
        }
        .empty-state .emoji {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }

        /* ===== FAB ===== */
        .fab-group {
            position: fixed;
            bottom: 20px;
            right: max(16px, calc((100vw - 540px) / 2 + 16px));
            display: flex;
            gap: 10px;
            z-index: 40;
        }

        @media (min-width: 640px) {
            .fab-group {
                right: max(24px, calc((100vw - 540px) / 2 + 24px));
                bottom: 28px;
            }
        }

        .fab {
            min-height: 50px;
            padding: 0 20px;
            border: 0;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 6px 24px rgba(198, 40, 40, 0.30);
            transition: transform var(--transition), background var(--transition), box-shadow var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .fab:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(198, 40, 40, 0.35);
        }
        .fab:active {
            transform: scale(0.96);
        }

        .fab-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }
        .fab-secondary:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
            box-shadow: var(--shadow-lg);
        }

        /* ===== EDITOR ===== */
        .editor-view {
            display: none; /* default tersembunyi */
            flex-direction: column;
            background: var(--bg-primary);
        }
        .editor-view:not([hidden]) {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
        }

        .editor-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .editor-header input {
            flex: 1;
            min-width: 100px;
            min-height: 40px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0 12px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-weight: 700;
            font-size: 15px;
            transition: border var(--transition), box-shadow var(--transition);
        }
        .editor-header input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(198, 40, 40, 0.10);
        }

        .editor-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }

        .editor-content {
            flex: 1;
            width: 100%;
            border: 0;
            outline: none;
            resize: none;
            padding: 16px 18px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font: inherit;
            line-height: 1.75;
            font-size: 15px;
            min-height: 200px;
        }
        .editor-content::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .editor-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 12px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .status-success {
            color: var(--success);
            font-weight: 700;
        }
        .status-warning {
            color: var(--warning);
            font-weight: 700;
        }
        .status-danger {
            color: var(--danger);
            font-weight: 700;
        }

        /* ===== BUTTONS ===== */
        .btn {
            min-height: 40px;
            padding: 8px 16px;
            border: 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
            transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
        }
        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            background: var(--bg-card);
            border-color: var(--text-secondary);
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: #b71c1c;
        }

        /* ===== FOOTER ===== */
        .app-footer {
            padding: 8px 14px;
            text-align: center;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            font-size: 11px;
            flex-shrink: 0;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: grid;
            place-items: center;
            padding: 18px;
            z-index: 70;
            backdrop-filter: blur(2px);
            animation: fadeIn 0.20s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal {
            width: min(100%, 440px);
            max-height: 85vh;
            overflow-y: auto;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 24px 22px;
            outline: none;
            border: 1px solid var(--border-color);
        }

        .modal-title {
            margin: 0 0 8px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .modal-message {
            margin: 0 0 16px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .modal-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        .modal-input,
        .modal-textarea {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            color: var(--text-primary);
            font: inherit;
            padding: 10px 12px;
            transition: border var(--transition), box-shadow var(--transition);
        }
        .modal-input:focus,
        .modal-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(198, 40, 40, 0.10);
        }

        .modal-input {
            min-height: 44px;
        }
        .modal-textarea {
            min-height: 160px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        /* ===== MOVE LIST ===== */
        .move-list {
            display: grid;
            gap: 6px;
            max-height: 40vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .move-option {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 44px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition);
        }
        .move-option:hover {
            background: var(--bg-primary);
            border-color: var(--accent);
        }
        .move-option input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            flex-shrink: 0;
        }

        /* ===== STATS ===== */
        .stats {
            display: grid;
            gap: 0;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .stat-row:last-child {
            border-bottom: 0;
        }

        .stat-label {
            color: var(--text-secondary);
            font-weight: 500;
        }
        .stat-value {
            font-weight: 700;
            text-align: right;
            overflow-wrap: anywhere;
        }

        /* ===== CONTEXT MENU ===== */
        .context-menu {
            position: fixed;
            z-index: 80;
            min-width: 200px;
            padding: 6px;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(8px);
            animation: fadeIn 0.12s ease-out;
        }

        .context-item {
            width: 100%;
            min-height: 40px;
            display: block;
            text-align: left;
            border-radius: 8px;
            background: transparent;
            padding: 8px 14px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: background var(--transition);
        }
        .context-item:hover {
            background: rgba(198, 40, 40, 0.06);
        }
        .context-item.danger {
            color: var(--danger);
        }
        .context-item.danger:hover {
            background: rgba(198, 40, 40, 0.10);
        }

        /* ===== TOAST ===== */
        .toast-root {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 82px;
            width: min(92vw, 420px);
            display: grid;
            gap: 8px;
            z-index: 99;
            pointer-events: none;
        }

        .toast {
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 12px 18px;
            border-radius: 14px;
            box-shadow: var(--shadow-lg);
            opacity: 1;
            transition: opacity 0.25s ease, transform 0.25s ease;
            font-weight: 500;
            font-size: 14px;
            text-align: center;
            pointer-events: auto;
        }
        .toast-hide {
            opacity: 0;
            transform: translateY(10px);
        }

        /* ===== FOCUS ===== */
        :focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
            border-radius: 6px;
        }

        /* ===== CONFETTI CONTAINER ===== */

        /* ===== COUNTDOWN BANNER ===== */

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  KONFIGURASI
            // ============================================================
            var APP_VERSION = '2.6.0';
            var STORAGE_KEY = 'AXN_NOTE_DATA';
            var RECOVERY_KEY = 'AXN_NOTE_DATA_RECOVERY';
            var SCHEMA_VERSION = 1;
            var FEEDBACK_EMAIL = 'axionneuralis@gmail.com';
            var SAFE_URL_SCHEMES = ['https:', 'http:', 'mailto:'];

            // ============================================================
            //  STATE
            // ============================================================
            var state = {
                data: defaultData(),
                storageAvailable: true,
                loadStatus: 'empty',
                ui: {
                    view: 'main',
                    currentFolderId: null,
                    searchQuery: '',
                    editor: {
                        activeFileId: null,
                        dirty: false
                    }
                }
            };

            // Elemen DOM
            var E = {};
            var activeMenu = null;
            var menuOutsideHandler = null;
            var menuEscHandler = null;
            var lastStorageError = 0;
            var confettiInterval = null;
            var countdownInterval = null;

            // ============================================================
            //  DATA DEFAULT
            // ============================================================
            function defaultData() {
                var now = new Date().toISOString();
                var folderId = 'folder_ri_81_' + Date.now();
                return {
                    schemaVersion: SCHEMA_VERSION,
                    folders: [{

                    }, {

                        content: 'HARI MERDEKA\nCipt. H. Mutahar\n\nTujuh belas agustus tahun empat lima\nItulah hari kemerdekaan kita\nHari merdeka nusa dan bangsa\nHari lahirnya bangsa Indonesia\nMerdeka!\n\nSekali merdeka tetap merdeka\nSelama hayat masih dikandung badan\nKita tetap setia tetap sedia\nMembela negara Indonesia!',
                        notified: false,

                    }],
                    settings: {
